    `<div class="z-hint">지금 이 순간 · 가상 실시간 타임라인 · 네트워크 불안정</div>${xFeed()}`}</div>${detail?`<div class="z-compose"><input data-comment-input placeholder="답글 게시하기 (시뮬레이션)"><button data-comment-send>게시</button></div>`:''}`}
  function boardRow(p,i){return `<div class="z-board-row" data-board="${i}"><div class="z-num">${boardPosts.length-i}</div><div class="z-rowmain"><div class="z-rowtitle">${esc(p.title)} <em>[${p.comments.length+Math.floor(p.views.replaceAll(',','')/623)}]</em></div><div class="z-rowmeta">${esc(p.board)} · ${esc(p.id)} · ${esc(p.time)} · 조회 ${p.views} · 추천 ${p.votes}</div></div></div>`}
  function makeBoard(){const detail=postIndex!==null;let posts=boardPosts.map((p,i)=>({...p,_i:i})).filter(p=>!query||[p.title,p.body,p.board].some(x=>x.toLowerCase().includes(query.toLowerCase())));return `<header class="z-header"><button data-zback>‹</button><div class="z-heading">${detail?'게시글': '실시간 커뮤니티'}</div><div class="z-small">익명 게시판<br>접속자 급증</div></header>${!detail?`<nav class="z-tabbar"><button data-ztab="live" class="${activeTab==='live'?'active':''}">실시간</button><button data-ztab="best" class="${activeTab==='best'?'active':''}">인기글</button><button data-ztab="search" class="${activeTab==='search'?'active':''}">검색</button></nav>`:''}<div class="z-scroll">${detail?(()=>{let p=boardPosts[postIndex];return `<div class="z-board-label">${esc(p.board)} 갤러리</div><article class="z-detail"><h2>${esc(p.title)}</h2><div class="z-rowmeta">${esc(p.id)} · 2026.10.19 ${esc(p.time)} · 조회 ${p.views} · 추천 ${p.votes}</div><div class="z-bodytext">${esc(p.body)}</div><div style="text-align:center;margin:14px"><button data-recommend style="border:1px solid #b8c6da;padding:10px 25px;border-radius:7px;color:#3063a4">👍 추천 ${p.votes}</button></div></article><div class="z-board-label">댓글 ${p.comments.length}</div>${p.comments.map(([name,text,time])=>`<div class="z-reply"><b>${esc(name)}</b><p>${esc(text)}</p><small>${esc(time)}</small></div>`).join('')}`})():`${activeTab==='search'?'<div class="z-searchbox" style="background:#e9eaf0;color:#535762">⌕ <input placeholder="게시글 검색" data-zsearch style="color:#111"></div>':''}<div class="z-board-top"><span class="z-pill">실시간</span> 서울·교통·일상 게시판에서 빠르게 확산 중인 글<br>※ 이 화면의 게시글은 모두 창작된 가상 기록입니다.</div>${(activeTab==='best'?posts.sort((a,b)=>b.votes-a.votes):posts).map(p=>boardRow(p,p._i)).join('')}`}</div>${detail?`<div class="z-compose"><input data-comment-input placeholder="댓글 입력 (이 기기에만 표시)"><button data-comment-send>등록</button></div>`:''}`}

  document.addEventListener('click',e=>{
    if(!current)return;
    const target=e.target;
    if(!current.contains(target))return;
    const tab=target.closest('[data-ztab]');if(tab){activeTab=tab.dataset.ztab;postIndex=null;query='';paint();return}
    if(target.closest('[data-zback]')){if(postIndex!==null){postIndex=null;paint()}else close();return}
    const trend=target.closest('[data-trend]');if(trend){query=trends[+trend.dataset.trend][1].replace(/^#/,'');activeTab='home';paint();return}
    if(target.closest('[data-heart],[data-rt],[data-bookmark]')){target.closest('button').classList.toggle('marked');return}
    if(target.closest('[data-replies]')){postIndex=+target.closest('[data-replies]').dataset.replies;paint();return}
    const t=target.closest('[data-tweet]');if(t){postIndex=+t.dataset.tweet;paint();return}
    const b=target.closest('[data-board]');if(b){postIndex=+b.dataset.board;paint();return}
    if(target.closest('[data-recommend]')){target.closest('button').textContent='👍 추천 완료';toast('이 페이지에서만 추천한 것으로 표시됩니다.');return}
    if(target.closest('[data-comment-send]')){const inp=$('[data-comment-input]',current);if(!inp?.value.trim())return;const v=inp.value.trim();const rr=document.createElement('div');rr.className='z-reply';rr.innerHTML='<b>나 · 김도현</b><p></p><small>방금 · 로컬 시뮬레이션</small>';rr.querySelector('p').textContent=v;const scroll=$('.z-scroll',current);scroll.append(rr);scroll.scrollTop=scroll.scrollHeight;inp.value='';toast('댓글이 이 기기의 시뮬레이션에 표시되었습니다.');return}
  });
  document.addEventListener('keydown',e=>{if(current&&e.key==='Escape'){e.stopImmediatePropagation();if(postIndex!==null){postIndex=null;paint()}else close()}},true);
  document.addEventListener('click',e=>{if(!current)return;const h=e.target.closest('#homebar');if(h){e.stopImmediatePropagation();e.preventDefault();close()}},true);
  document.addEventListener('click',e=>{const shortcut=e.target.closest('.cr-short > div');if(!shortcut)return;const label=shortcut.querySelector('span')?.textContent||'';if(label==='X 실트'||label==='커뮤니티'){e.stopPropagation();open(label==='X 실트'?'x':'board')}},true);
  const decorate=()=>{
    $$('.home .grid .app[data-app="blockblast"]').forEach(b=>{if(b.dataset.zadded)return;b.dataset.zadded='1';b.dataset.app='z-x';b.innerHTML='<div class="ic" style="background:#050505;display:flex;align-items:center;justify-content:center"><span style="font-size:40px;font-weight:600;color:white;line-height:1">𝕏</span></div><span>X</span>';b.addEventListener('click',e=>{e.stopPropagation();open('x')})});

    $$('.lock .lk-main').forEach(el=>{if(el.querySelector('.z-lockalerts'))return;const n=document.createElement('div');n.className='z-lockalerts';n.innerHTML=`<div class="z-alert z-alert-danger"><div class="z-alert-top"><b>🚨 긴급재난문자 · 서울특별시</b><span>18:15</span></div><div class="z-alert-body">서울역·시청역 등 주요 역사 접근 금지. 주변 실내에 대피하고 출입문을 잠그십시오.</div></div><div class="z-alert"><div class="z-alert-top"><b>카카오톡 · 민서 ❤️</b><span>18:16</span></div><div class="z-alert-body">지금 누가 문 두드려. 계속.</div></div><div class="z-alert"><div class="z-alert-top"><b>전화 · 부재중 18통</b><span>18:15</span></div><div class="z-alert-body">민서 ❤️ (6) · 지우 (3) · 엄마 (4) 외</div></div>`;el.append(n)});
    $$('.cr-when').forEach(el=>{if(el.textContent.includes('2026.10.18'))el.textContent=el.textContent.replace('2026.10.18','2026.10.19')});
    $$('.cr-inline-ad').forEach(el=>el.remove());
  };
  // 원본 앱은 화면을 열 때 DOM을 생성하므로 새 화면의 변화를 관찰
  const watcher=new MutationObserver(decorate);watcher.observe(document.getElementById('device'),{childList:true,subtree:true});decorate();
})();

function home(){while(state.stack.length>1)pop()}
function time(){let start=(18*3600+17*60+40)+elapsed;let h=Math.floor(start/3600)%24,m=Math.floor(start/60)%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}

function dramaticNotice(msg){
  if(!layer.classList.contains('open')||state.locked)return;
  let stack=device.querySelector('.disaster-stack');
  if(!stack){stack=document.createElement('div');stack.className='disaster-stack';device.append(stack)}
  const el=document.createElement('button');el.className='disaster-note';
  const parts=msg.split(' · ');const title=parts.shift()||'알림';el.innerHTML=`<div class="dn-head"><b>${esc(title)}</b><small>지금</small></div><div>${esc(parts.join(' · '))}</div>`;
  const kind=msg.includes('카카오톡')?'kakao':(msg.includes('재난')||msg.includes('속보'))?'chrome':msg.includes('전화')?'phone':'messages';
  el.addEventListener('click',()=>{el.remove();if(!state.call)openApp(kind)});
  stack.prepend(el);
  requestAnimationFrame(()=>el.classList.add('visible'));
  while(stack.children.length>4)stack.lastElementChild.remove();
  setTimeout(()=>{el.classList.remove('visible');setTimeout(()=>el.remove(),450)},6200);
}

function chatScreen(name,isK){
  const source=isK?P.kakao.rooms:P.messages.chats;
  const msgs=source[name]||[];
  let head=isK
    ? `<div class="chat-native-head chat-kheader"><button class="chat-nav-back" data-action="back" aria-label="뒤로">‹</button><b>${esc(name)}</b><button class="chat-nav-more" data-action="call-chat" data-person="${esc(name)}" aria-label="전화">⌕</button></div>`
    : `<div class="chat-native-head chat-iheader"><button class="chat-nav-back" data-action="back" aria-label="뒤로">‹</button><div class="chat-contact"><span class="chat-contact-avatar">${av(name)}</span><b>${esc(name)} <i>›</i></b></div><button class="chat-nav-more" data-action="call-chat" data-person="${esc(name)}" aria-label="통화">◉</button></div>`;
  const items=msgs.map(m=>m.date?`<div class="chat-date">${esc(m.date)}</div>`:`<div class="bubble-row ${m.me?'me':''}"><div class="bubble">${esc(m.text??'').replace(/\n/g,'<br>')}</div><small class="bub-time">${esc(m.time??'')}</small></div>`).join('');
  const scr=makeScreen(`${head}<div class="scroll chat-scroll" data-autobottom><div class="chat-log">${items}</div></div>
    <div class="choice-panel" data-choices></div>
    <form class="chat-compose"><span class="compose-plus">＋</span><input aria-label="메시지" placeholder="${isK?'메시지 입력':'iMessage'}" autocomplete="off"><button type="submit" aria-label="전송">↑</button></form>`,isK?'chat-bg chat-scene':'chat-im chat-scene');
  scr.dataset.chat=name;scr.dataset.kind=isK?'k':'m';
  scr.querySelector('.chat-compose').addEventListener('submit',e=>{e.preventDefault();let inp=scr.querySelector('input');let text=inp.value.trim();if(!text)return;inp.value='';sendChat(scr,name,isK,text)});
  scr.addEventListener('click',e=>{const c=e.target.closest('[data-choice]');if(c)applyChoice(scr,name,isK,Number(c.dataset.choice))});
  renderChoices(scr,name);return scr;
}
function renderChoices(s,name){
  const panel=s.querySelector('[data-choices]');if(!panel)return;
  const conf=window.ZOMBIE_CHOICES?.[name];if(!conf){panel.remove();return;}
  if(!state.choiceStage)state.choiceStage={};let stage=state.choiceStage[name]??0;
  if(stage===-1){panel.innerHTML='<div class="choice-connection">◌ 마지막 연결 이후 응답이 없습니다</div>';return;}
  const opts=conf.stages[stage]?.options||[];
  panel.innerHTML=opts.map((o,i)=>`<button type="button" class="choice-chip" data-choice="${i}">${esc(o.label)} <span>↗</span></button>`).join('');
}
function applyChoice(s,name,isK,i){
  if(!state.choiceStage)state.choiceStage={};const phase=state.choiceStage[name]??0;
  if(phase===-1)return;const opt=window.ZOMBIE_CHOICES?.[name]?.stages[phase]?.options[i];if(!opt)return;
  const src=isK?P.kakao.rooms:P.messages.chats;
  if(!src[name])src[name]=[];
  const tm=time();src[name].push({me:true,text:opt.send,time:tm});appendChat(s,true,opt.send,tm);
  const target=(isK?P.kakao.chats:P.messages.threads).find(c=>c.name===name);
  if(target){target.preview=opt.send;target.when=tm;target.unread=0}
  const panel=s.querySelector('[data-choices]');if(panel)panel.innerHTML='<div class="choice-connection typing-dot">상대방이 입력 중…</div>';
  const replies=(opt.replies||[]).filter(Boolean);
  state.choiceStage[name]=opt.end?-1:(Number.isFinite(opt.next)?opt.next:phase+1);
  replies.forEach((r,j)=>setTimeout(()=>{if(!layer.classList.contains('open'))return;src[name].push({text:r,time:time()});if(s.isConnected)appendChat(s,false,r,time());},(j+1)*1450));
  setTimeout(()=>{if(!s.isConnected)return;if(opt.end){panel.innerHTML=`<div class="choice-connection">${esc(opt.end)}</div>`;}else renderChoices(s,name)},(replies.length+1)*1450);
}
function sendChat(s,name,isK,text){let src=isK?P.kakao.rooms:P.messages.chats;if(!src[name])src[name]=[];src[name].push({me:true,text,time:time()});appendChat(s,true,text,time());let db=isK?P.kakao:P.messages;const norm=v=>String(v||'').replace(/\s+/g,'').toLowerCase();if(!state.replyStop)state.replyStop={};let rules=db.keywordReplies?.[name]||[],picked=null;for(const rule of rules){if((rule.match||[]).some(k=>norm(text).includes(norm(k)))){picked=rule;break}}if(picked&&!state.replyStop[(isK?'k:':'m:')+name]){(picked.reply||[]).forEach((r,j)=>setTimeout(()=>{if(!layer.classList.contains('open'))return;src[name].push({text:r,time:time()});if(s.isConnected)appendChat(s,false,r,time());},(j+1)*1800));if(picked.stopAfter)state.replyStop[(isK?'k:':'m:')+name]=true;}else{let ar=db.anyReplies?.[name];const key=(isK?'k:':'m:')+name;const n=state.replyIdx[key]||0;if(ar&&n<ar.length){state.replyIdx[key]=n+1;let reply=ar[n];(Array.isArray(reply)?reply:[reply]).forEach((r,j)=>setTimeout(()=>{if(!layer.classList.contains('open'))return;src[name].push({text:r,time:time()});if(s.isConnected)appendChat(s,false,r,time());},(j+1)*1700));}}let target=(isK?P.kakao.chats:P.messages.threads).find(c=>c.name===name);if(target){target.preview=text;target.when=time();target.unread=0}}
function appendChat(s,me,t,clock){let d=document.createElement('div');d.className='bubble-row'+(me?' me':'');d.innerHTML=`<div class="bubble"></div><small class="bub-time">${esc(clock)}</small>`;d.querySelector('.bubble').textContent=t;s.querySelector('.chat-log').append(d);let sc=s.querySelector('.chat-scroll');sc.scrollTop=sc.scrollHeight}

function switchPhone(s,t){let content=s.querySelector('.scroll');if(t==='recent'){content.innerHTML=`<div class="bigtitle">최근 통화</div><div class="call-list">${callListHTML('all')}</div>`}else if(t==='keypad'){content.innerHTML=`<div style="text-align:center;padding:35px 20px;font-size:27px" class="dialnum">　</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 55px">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>`<button data-action="digit" data-digit="${n}" style="background:#e9e9ee;border:0;border-radius:50%;height:65px;width:65px;font-size:25px">${n}</button>`).join('')}</div><div style="text-align:center;padding:17px"><button data-action="dial-num" style="border:0;background:#39bd5d;border-radius:50%;height:70px;width:70px;font-size:28px;color:white">☎</button></div>`;s.dataset.num=''}else if(t==='voicemail'){content.innerHTML=`<div class="bigtitle">음성 사서함</div>${P.voicemail.map((v,i)=>`<div class="vm-card"><div class="vm-h"><b>${esc(v.from)}</b><span>${esc(v.date)} ${v.new?'🔴':''}</span></div><button data-action="voice" data-id="${i}">▶ 재생　${esc(v.length)}</button><div class="transcript"></div></div>`).join('')}`}else{content.innerHTML=`<div class="bigtitle">즐겨찾기</div>${['엄마','민서 ❤️','지우 (회사)','119'].map(n=>`<div class="call-row" data-action="dial" data-name="${n}"><b>${esc(n)}</b>☎</div>`).join('')}`}}
function outgoingCall(name){if(state.call)return;let c=makeCall(name,false);const cfg=P.callScripts[name]||P.callScripts['기본'];let valid=Math.random()<(cfg.answer??P.callScripts.answerRate??0.05);let wait=2600;state.callTimers.push(setTimeout(()=>{if(!state.call)return;if(!valid){$('#callState').textContent=name==='119'?'현재 연결량이 많아 통화가 지연됩니다':'연결할 수 없습니다';state.callTimers.push(setTimeout(endCall,2200))}else runCallLines(cfg.lines||[])},wait));return c}
function incomingCall(){if(state.call)return;let c=makeCall(P.incomingCall.from,true);state.callTimers.push(setTimeout(()=>{if(state.call&&state.call.dataset.incoming==='true')endCall()},30000));return c}
function makeCall(name,incoming){let c=document.createElement('div');c.className='call-ui';c.dataset.incoming=incoming?'true':'false';c.innerHTML=`<div class="call-person">${esc(name)}</div><div id="callState" class="call-state">${incoming?'수신 전화':'연결 중...'}</div><div class="call-lines" id="callLines"></div><div class="call-buttons"><span><b>◉</b>소리 끔</span><span><b>▦</b>키패드</span><span><b>♬</b>스피커</span></div><div style="display:flex;gap:60px;align-items:center"><button class="hang" data-action="hang">☎</button>${incoming?'<button class="answer" data-action="answer">☎ 통화하기</button>':''}</div>`;device.append(c);state.call=c;return c}
function runCallLines(lines){$('#callState').textContent='00:01';const part=$('#callLines');let ms=650;for(const p of lines){let t=ms;state.callTimers.push(setTimeout(()=>{if(!state.call)return;part.innerHTML=`<small>${p.who==='me'?'나':esc($('.call-person').textContent)}</small><div></div>`;part.querySelector('div').textContent=p.text;if(p.cut)$('#callState').textContent='연결 불안정'},t));ms+=p.ms||2500;if(p.cut){ms+=900;break}}state.callTimers.push(setTimeout(endCall,ms+1400))}
function endCall(){state.callTimers.forEach(clearTimeout);state.callTimers=[];state.call?.remove();state.call=null}

ase'shutter':toast('사진 저장됨 · 화면 밖에서는 소리가 들리지 않습니다');break;case'timer-start':toast('타이머를 설정했습니다. 3분 뒤 다시 확인하세요.');break;}return}let b=e.target.closest('[data-app]');if(b){openApp(b.dataset.app);return}});

storyHTML();if(location.hash==='#phone')openPhone();

const posts=[{id:'minseo.zip',symbol:'☕',bg:'linear-gradient(150deg,#ca988d,#ac786b)',text:'오늘 저녁은 떡볶이다 ㅎ',time:'4시간 전',likes:'98'},

let current=null,mode='feed',person=0,frame=0,timer=null,shown=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pause(){if(timer){clearTimeout(timer);timer=null}}
function renderFeed(){mode='feed';pause(); if(!current)return;
 const rows=stories.map((s,i)=>`<button class="zi-story-tap" data-zi-person="${i}"><span class="zi-story-ring"><i style="color:${s.theme}">${esc(s.avatar)}</i></span><span class="zi-nick">${esc(s.name)}</span></button>`).join('');
 const timeline=posts.map(p=>`<article class="zi-post"><div class="zi-posthead"><span class="zi-avatar">${esc(p.id[0].toUpperCase())}</span><div>${esc(p.id)}<small>${esc(p.time)}</small></div></div><div class="zi-post-art" style="background:${esc(p.bg)}"><div class="symbol">${esc(p.symbol)}</div><div class="desc">${esc(p.text)}</div></div><div class="zi-postfoot"><div class="zi-footicons"><span>♡　▢　➤</span><span>♧</span></div><b>좋아요 ${esc(p.likes)}개</b><div>${esc(p.id)}　${esc(p.text)}</div></div></article>`).join('');
 const dms=(window.PHONE?.insta?.dms||[]).map((d,i)=>`<div class="zi-dm" data-zi-dm="${i}"><div class="zi-dm-avatar">${esc((d.name||'?').slice(0,1))}</div><div><b>${esc(d.name)}</b><p>${esc(d.preview)}</p></div></div>`).join('');
 current.innerHTML=`<header class="zi-head"><strong>Instagram</strong><button data-zi-close aria-label="닫기">×</button></header><div class="zi-scroll"><div class="zi-story-rail">${rows}</div>${timeline}<div class="zi-dm-title">메시지</div>${dms}</div>`;
}
function showStory(p,f){pause(); mode='story';person=p;frame=f;const s=stories[p],x=s.frames[f];
 const bars=s.frames.map((_,i)=>`<span class="${i<f?'past':i===f?'now':''}">${i===f?'<i></i>':''}</span>`).join('');
 current.innerHTML=`<div class="zi-stager"><div class="zi-progress">${bars}</div><div class="zi-story-top"><div class="zi-face" style="background:${s.theme}">${esc(s.avatar)}</div><div><strong>${esc(s.id)}</strong><small>${esc(x.time)}</small></div><button data-zi-close aria-label="스토리 닫기">×</button></div><div class="zi-story-card" style="background:${esc(x.bg)}"><div class="zi-card-decor"></div><button aria-label="이전 스토리" class="zi-touch-prev" data-zi-prev></button><button aria-label="다음 스토리" class="zi-touch-next" data-zi-next></button><div class="zi-card-center"><div class="zi-card-top">${esc(x.kind)}</div><div class="zi-card-title">${esc(x.title)}</div><div class="zi-card-text">${esc(x.msg)}</div></div></div><div class="zi-story-footer">메시지 보내기…</div></div>`;
 timer=setTimeout(()=>next(),5200);
}
function next(){let p=person, f=frame+1;if(f>=stories[p].frames.length){p++;f=0}if(p>=stories.length){renderFeed();return}showStory(p,f)}
function prev(){let p=person, f=frame-1;if(f<0){p--;if(p<0){showStory(0,0);return}f=stories[p].frames.length-1}showStory(p,f)}
function close(){pause();if(current){current.remove();current=null}document.getElementById('statusbar')?.classList.remove('light');document.getElementById('homebar')?.classList.remove('light')}
function open(){if(current)close();const screens=document.getElementById('screens');if(!screens)return;current=document.createElement('div');current.className='zi-shell';screens.appendChild(current);document.getElementById('statusbar')?.classList.remove('light');renderFeed()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-app="insta"]');if(a){e.preventDefault();e.stopImmediatePropagation();open();return}
if(!current)return;
if(e.target.closest('#homebar')){e.preventDefault();e.stopImmediatePropagation();close();return}
if(!current.contains(e.target))return;
const b=e.target.closest('[data-zi-person],[data-zi-prev],[data-zi-next],[data-zi-close],[data-zi-dm]');if(!b)return;
e.preventDefault();e.stopPropagation();
if(b.hasAttribute('data-zi-close')){if(mode==='story')renderFeed();else close()}
else if(b.hasAttribute('data-zi-prev'))prev();else if(b.hasAttribute('data-zi-next'))next();
else if(b.hasAttribute('data-zi-person'))showStory(+b.dataset.ziPerson,0);
else if(b.hasAttribute('data-zi-dm')){const d=window.PHONE?.insta?.dms?.[+b.dataset.ziDm];if(d){const label=document.createElement('div');label.style.cssText='padding:35px 22px;text-align:center;color:#555';label.textContent=(d.name||'상대')+'에게 전송이 지연되고 있습니다.';current.querySelector('.zi-scroll')?.prepend(label);setTimeout(()=>label.remove(),3000)}}
},true);
document.addEventListener('keydown',e=>{if(current&&e.key==='Escape'){e.stopImmediatePropagation();if(mode==='story')renderFeed();else close()}},true);
})();</script>
