function chatScreen(name,isK){let src=isK?P.kakao.rooms:P.messages.chats;let msgs=src[name]||[];let head=hnav(name,true,'☎');let cls=isK?'chat-bg':'chat-im';let s=makeScreen(`${head}<div class="scroll chat-scroll" data-autobottom><div class="chat-log">${msgs.map(m=>m.date?`<div class="chat-date">${esc(m.date)}</div>`:`<div class="bubble-row ${m.me?'me':''}">${!m.me&&isK?`<span style="font-size:10px;color:#546b7d">●</span>`:''}<div class="bubble">${esc(m.text??'').replace(/\n/g,'<br>')}</div><small class="bub-time">${esc(m.time??'')}</small></div>`).join('')}</div></div><form class="chat-compose"><input aria-label="메시지" placeholder="${isK?'메시지 입력':'문자 메시지'}" autocomplete="off"><button type="submit">전송</button></form>`,cls);s.dataset.chat=name;s.dataset.kind=isK?'k':'m';s.querySelector('.chat-compose').addEventListener('submit',e=>{e.preventDefault();let inp=s.querySelector('input');let text=inp.value.trim();if(!text)return;inp.value='';sendChat(s,name,isK,text)});return s}
function sendChat(s,name,isK,text){let src=isK?P.kakao.rooms:P.messages.chats;if(!src[name])src[name]=[];src[name].push({me:true,text,time:time()});appendChat(s,true,text,time());let db=isK?P.kakao:P.messages,ar=db.anyReplies?.[name];const n=state.replyIdx[name]||0;if(ar&&n<ar.length){state.replyIdx[name]=n+1;let reply=ar[n];(Array.isArray(reply)?reply:[reply]).forEach((r,j)=>setTimeout(()=>{if(!layer.classList.contains('open'))return;src[name].push({text:r,time:time()});if(s.isConnected)appendChat(s,false,r,time());},(j+1)*1700));}let target=(isK?P.kakao.chats:P.messages.threads).find(c=>c.name===name);if(target){target.preview=text;target.when=time();target.unread=0}}

function outgoingCall(name){if(state.call)return;let c=makeCall(name,false);const cfg=P.callScripts[name]||P.callScripts['기본'];let valid=Math.random()<(cfg.answer??P.callScripts.answerRate??0.05);let wait=2600;state.callTimers.push(setTimeout(()=>{if(!state.call)return;if(!valid){$('#callState').textContent=name==='119'?'현재 연결량이 많아 통화가 지연됩니다':'연결할 수 없습니다';state.callTimers.push(setTimeout(endCall,2200))}else runCallLines(cfg.lines||[])},wait));return c}

function makeCall(name,incoming){let c=document.createElement('div');c.className='call-ui';c.dataset.incoming=incoming?'true':'false';c.innerHTML=`<div class="call-person">${esc(name)}</div><div id="callState" class="call-state">${incoming?'수신 전화':'연결 중...'}</div><div class="call-lines" id="callLines"></div><div class="call-buttons"><span><b>◉</b>소리 끔</span><span><b>▦</b>키패드</span><span><b>♬</b>스피커</span></div><div style="display:flex;gap:60px;align-items:center"><button class="hang" data-action="hang">☎</button>${incoming?'<button class="answer" data-action="answer">☎ 통화하기</button>':''}</div>`;device.append(c);state.call=c;return c}
function runCallLines(lines){$('#callState').textContent='00:01';const part=$('#callLines');let ms=650;for(const p of lines){let t=ms;state.callTimers.push(setTimeout(()=>{if(!state.call)return;part.innerHTML=`<small>${p.who==='me'?'나':esc($('.call-person').textContent)}</small><div></div>`;part.querySelector('div').textContent=p.text;if(p.cut)$('#callState').textContent='연결 불안정'},t));ms+=p.ms||2500;if(p.cut){ms+=900;break}}state.callTimers.push(setTimeout(endCall,ms+1400))}

    {board:'국내야구',title:'[정보] "군 통금" 이미지는 합성이라고 함',id:'ㅇㅇ',time:'18:06',views:'36,825',votes:403,comments:[['ㅇㅇ','제발 가짜뉴스 좀 그만','18:07']],body:'공식 발표 확인된 거 없다. 무턱대고 퍼나르지 마라.\n불확실한 상황에 가짜 정보 너무 많음.'},
    {board:'싱글벙글',title:'제발 누가 장난이라고 말 좀 해봐라',id:'ㅇㅇ',time:'18:03',views:'61,922',votes:1029,comments:[['ㅇㅇ','진짜 그냥 자고 일어나면 끝났으면','18:03']],body:'평범하게 출근해서 커피 한 잔 마셨는데 퇴근을 못함.\n내일이면 이게 다 끝났으면 좋겠다.'},
    {board:'교통',title:'서울역 주변 버스 전면 우회 중임?',id:'ㅇㅇ',time:'17:54',views:'12,164',votes:87,comments:[['ㅇㅇ','길이 너무 막혀서 버스 못 움직임','17:55']],body:'아직 공식 교통상황 앱에는 일부 정상인데 현장은 전혀 다른 것 같음.'},
    {board:'국내야구',title:'종로 영상 원본 봤는데 일단 영상 내림',id:'ㅇㅇ',time:'17:36',views:'82,049',votes:765,comments:[['ㅇㅇ','신상 노출만은 하지 말자','17:37']],body:'사람 얼굴 너무 잘 보이고 상황이 심각한 것 같아서 공유 안 하겠음. 확인되기 전까지 함부로 결론 내리지 말자.'},
    {board:'싱글벙글',title:'오늘 퇴근하고 치킨 시킬 사람 개추',id:'ㅇㅇ',time:'16:24',views:'23,728',votes:330,comments:[['ㅇㅇ','세 시간 전이 먼 옛날 같다','18:11']],body:'내일 화요일이라 더 힘들다 ㅋㅋ\n치킨이나 먹자'}
  ];
  const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
  let current=null,kind='',activeTab='',postIndex=null,query='';
  function toast(text){if(!current)return;current.querySelector('.z-toast')?.remove();const x=document.createElement('div');x.className='z-toast';x.textContent=text;current.append(x);setTimeout(()=>x.remove(),2300)}
  function close(){if(!current)return;current.remove();current=null;kind='';$('#statusbar')?.classList.remove('light');$('#homebar')?.classList.remove('light')}
  function open(k){close();kind=k;activeTab=k==='x'?'home':'live';postIndex=null;query='';current=document.createElement('section');current.className='z-modal '+(k==='x'?'x-theme':'');current.setAttribute('role','dialog');current.setAttribute('aria-label',k==='x'?'X 실시간':'인터넷 커뮤니티');$('#screens')?.append(current);paint();if(k==='x'){$('#statusbar')?.classList.add('light');$('#homebar')?.classList.add('light')}else{$('#statusbar')?.classList.remove('light');$('#homebar')?.classList.remove('light')}}
  function formatTweet(p,i){return `<article class="z-post" data-tweet="${i}"><div class="z-author"><div class="z-avatar" style="background:${['#4d607d','#7b3058','#496a53','#805442','#313d61'][i%5]}">${esc(p.avatar)}</div><div class="z-author-info"><strong>${esc(p.name)} ${p.verified?'🔹':''}</strong><small>@${esc(p.id)} · ${esc(p.time)}</small></div><span style="color:#7e7e87">···</span></div><p class="z-post-content">${esc(p.text)}</p><div class="z-actions"><button data-replies="${i}">♧ ${esc(p.replies)}</button><button data-rt="${i}">⇄ ${esc(p.rt)}</button><button data-heart="${i}">♡ ${esc(p.likes)}</button><button data-bookmark="${i}">♧</button></div></article>`}
  function xFeed(){let arr=tweets.map((p,i)=>({...p,_i:i})).filter(p=>!query||[p.name,p.id,p.text].some(x=>x.toLowerCase().includes(query.toLowerCase())));return arr.length?arr.map(p=>formatTweet(p,p._i)).join(''):'<div class="z-offline"><strong>검색 결과 없음</strong><p>게시물을 찾지 못했습니다.</p></div>'}
  function makeX(){const detail=postIndex!==null;return `<header class="z-header"><button data-zback aria-label="뒤로">‹</button><div class="z-heading">${detail?'게시물':activeTab==='trends'?'탐색':activeTab==='alerts'?'알림':'𝕏'}</div><div class="z-small">실시간 기록<br>18:17 KST</div></header>${!detail?`<nav class="z-tabbar"><button data-ztab="home" class="${activeTab==='home'?'active':''}">추천</button><button data-ztab="trends" class="${activeTab==='trends'?'active':''}">트렌드</button><button data-ztab="alerts" class="${activeTab==='alerts'?'active':''}">알림</button></nav>`:''}<div class="z-scroll">${detail?formatTweet(tweets[postIndex],postIndex)+`<div class="z-section">답글</div>${[
    ['현장 제보 먼저 믿고 싶지만 나도 지금 뭘 봤는지 모르겠음','2분 전'],['제발 다들 살아 있어 줘요','1분 전'],['정확한 위치랑 촬영 시각 확인 후 공유해 주세요','방금']
  ].map((r,i)=>`<div class="z-reply"><b>@reply_${i+2}</b><p>${esc(r[0])}</p><small>${r[1]}</small></div>`).join('')}`:
    activeTab==='trends'?`<div class="z-searchbox">⌕ <input placeholder="X 검색" data-zsearch value="${esc(query)}"></div><div class="z-section">대한민국의 트렌드</div>${trends.map((t,i)=>`<div class="z-trend" data-trend="${i}"><small>${esc(t[0])}</small><strong>${esc(t[1])}</strong><em>${esc(t[2])}</em></div>`).join('')}`:
    activeTab==='alerts'?`<div class="z-section">새 알림</div><div class="z-feature" style="background:#2b1b1d;color:#fff;border-left-color:#ff4343">⏺ 현재 상황을 전하는 게시물이 급증하고 있습니다.<br>일부 콘텐츠는 확인되지 않았습니다.</div>${tweets.slice(0,4).map((p,i)=>`<div class="z-reply" data-tweet="${i}"><b>@${esc(p.id)}</b><p>${esc(p.text.slice(0,125))}</p><small>${p.time}</small></div>`).join('')}`:
    `<div class="z-hint">지금 이 순간 · 가상 실시간 타임라인 · 네트워크 불안정</div>${xFeed()}`}</div>${detail?`<div class="z-compose"><input data-comment-input placeholder="답글 게시하기 (시뮬레이션)"><button data-comment-send>게시</button></div>`:''}`}
  function boardRow(p,i){return `<div class="z-board-row" data-board="${i}"><div class="z-num">${boardPosts.length-i}</div><div class="z-rowmain"><div class="z-rowtitle">${esc(p.title)} <em>[${p.comments.length+Math.floor(p.views.replaceAll(',','')/623)}]</em></div><div class="z-rowmeta">${esc(p.board)} · ${esc(p.id)} · ${esc(p.time)} · 조회 ${p.views} · 추천 ${p.votes}</div></div></div>`}
  function makeBoard(){const detail=postIndex!==null;let posts=boardPosts.map((p,i)=>({...p,_i:i})).filter(p=>!query||[p.title,p.body,p.board].some(x=>x.toLowerCase().includes(query.toLowerCase())));return `<header class="z-header"><button data-zback>‹</button><div class="z-heading">${detail?'게시글': '실시간 커뮤니티'}</div><div class="z-small">익명 게시판<br>접속자 급증</div></header>${!detail?`<nav class="z-tabbar"><button data-ztab="live" class="${activeTab==='live'?'active':''}">실시간</button><button data-ztab="best" class="${activeTab==='best'?'active':''}">인기글</button><button data-ztab="search" class="${activeTab==='search'?'active':''}">검색</button></nav>`:''}<div class="z-scroll">${detail?(()=>{let p=boardPosts[postIndex];return `<div class="z-board-label">${esc(p.board)} 갤러리</div><article class="z-detail"><h2>${esc(p.title)}</h2><div class="z-rowmeta">${esc(p.id)} · 2026.10.19 ${esc(p.time)} · 조회 ${p.views} · 추천 ${p.votes}</div><div class="z-bodytext">${esc(p.body)}</div><div style="text-align:center;margin:14px"><button data-recommend style="border:1px solid #b8c6da;padding:10px 25px;border-radius:7px;color:#3063a4">👍 추천 ${p.votes}</button></div></article><div class="z-board-label">댓글 ${p.comments.length}</div>${p.comments.map(([name,text,time])=>`<div class="z-reply"><b>${esc(name)}</b><p>${esc(text)}</p><small>${esc(time)}</small></div>`).join('')}`})():`${activeTab==='search'?'<div class="z-searchbox" style="background:#e9eaf0;color:#535762">⌕ <input placeholder="게시글 검색" data-zsearch style="color:#111"></div>':''}<div class="z-board-top"><span class="z-pill">실시간</span> 서울·교통·일상 게시판에서 빠르게 확산 중인 글<br>※ 이 화면의 게시글은 모두 창작된 가상 기록입니다.</div>${(activeTab==='best'?posts.sort((a,b)=>b.votes-a.votes):posts).map(p=>boardRow(p,p._i)).join('')}`}</div>${detail?`<div class="z-compose"><input data-comment-input placeholder="댓글 입력 (이 기기에만 표시)"><button data-comment-send>등록</button></div>`:''}`}
  function paint(){if(!current)return;current.innerHTML=kind==='x'?makeX():makeBoard();const s=$('.z-scroll',current);if(s)s.scrollTop=0;const input=$('[data-zsearch]',current);if(input){input.addEventListener('input',e=>query=e.target.value);input.addEventListener('keydown',e=>{if(e.key!=='Enter')return; e.preventDefault();if(kind==='x')activeTab='home';paint()})}}
  document.addEventListener('click',e=>{
    if(!current)return;
    const target=e.target;
    if(!current.contains(target))return;
    const tab=target.closest('[data-ztab]');if(tab){activeTab=tab.dataset.ztab;postIndex=null;query='';paint();return}
    if(target.closest('[data-zback]')){if(postIndex!==null){postIndex=null;paint()}else close();return}
    const trend=target.closest('[data-trend]');if(trend){query=trends[+trend.dataset.trend][1].replace(/^#/,'');activeTab='home';paint();return}
    if(target.closest('[data-heart],[data-rt],[data-bookmark]')){target.closest('button').classList.toggle('marked');return}
    if(target.closest('[data-replies]')){postIndex=+target.closest('[data-replies]').dataset.replies;paint();return}
    const t=target.closest('[data-tweet]');if(t){postIndex=+t.dataset.tweet;paint();return}
    const b=target.closest('[data-board]');if(b){postIndex=+b.dataset.board;paint();return}
    if(target.closest('[data-recommend]')){target.closest('button').textContent='👍 추천 완료';toast('이 페이지에서만 추천한 것으로 표시됩니다.');return}
    if(target.closest('[data-comment-send]')){const inp=$('[data-comment-input]',current);if(!inp?.value.trim())return;const v=inp.value.trim();const rr=document.createElement('div');rr.className='z-reply';rr.innerHTML='<b>나 · 김도현</b><p></p><small>방금 · 로컬 시뮬레이션</small>';rr.querySelector('p').textContent=v;const scroll=$('.z-scroll',current);scroll.append(rr);scroll.scrollTop=scroll.scrollHeight;inp.value='';toast('댓글이 이 기기의 시뮬레이션에 표시되었습니다.');return}
  });
  document.addEventListener('keydown',e=>{if(current&&e.key==='Escape'){e.stopImmediatePropagation();if(postIndex!==null){postIndex=null;paint()}else close()}},true);
  document.addEventListener('click',e=>{if(!current)return;const h=e.target.closest('#homebar');if(h){e.stopImmediatePropagation();e.preventDefault();close()}},true);
  document.addEventListener('click',e=>{const shortcut=e.target.closest('.cr-short > div');if(!shortcut)return;const label=shortcut.querySelector('span')?.textContent||'';if(label==='X 실트'||label==='커뮤니티'){e.stopPropagation();open(label==='X 실트'?'x':'board')}},true);
  const decorate=()=>{
    $$('.home .grid .app[data-app="blockblast"]').forEach(b=>{if(b.dataset.zadded)return;b.dataset.zadded='1';b.dataset.app='z-x';b.innerHTML='<div class="ic" style="background:#050505;display:flex;align-items:center;justify-content:center"><span style="font-size:40px;font-weight:600;color:white;line-height:1">𝕏</span></div><span>X</span>';b.addEventListener('click',e=>{e.stopPropagation();open('x')})});
    $$('.home .grid .app[data-app="mines"]').forEach(b=>{if(b.dataset.zadded)return;b.dataset.zadded='1';b.dataset.app='z-board';b.innerHTML='<div class="ic" style="background:linear-gradient(155deg,#448cff,#2055bc);display:flex;align-items:center;justify-content:center"><span style="font-size:26px;font-weight:900;color:white;line-height:1">갤</span></div><span>커뮤니티</span>';b.addEventListener('click',e=>{e.stopPropagation();open('board')})});
    $$('.lock .lk-main').forEach(el=>{if(el.querySelector('.z-lockalerts'))return;const n=document.createElement('div');n.className='z-lockalerts';n.innerHTML=`<div class="z-alert z-alert-danger"><div class="z-alert-top"><b>🚨 긴급재난문자 · 서울특별시</b><span>18:15</span></div><div class="z-alert-body">서울역·시청역 등 주요 역사 접근 금지. 주변 실내에 대피하고 출입문을 잠그십시오.</div></div><div class="z-alert"><div class="z-alert-top"><b>카카오톡 · 민서 ❤️</b><span>18:16</span></div><div class="z-alert-body">지금 누가 문 두드려</div></div><div class="z-alert"><div class="z-alert-top"><b>전화 · 부재중 18통</b><span>18:15</span></div><div class="z-alert-body">민서 ❤️ (6) · 지우 (3) · 엄마 (4) 외</div></div>`;el.append(n)});
    $$('.cr-when').forEach(el=>{if(el.textContent.includes('2026.10.18'))el.textContent=el.textContent.replace('2026.10.18','2026.10.19')});
    $$('.cr-inline-ad').forEach(el=>el.remove());
  };
  // 원본 앱은 화면을 열 때 DOM을 생성하므로 새 화면의 변화를 관찰
  const watcher=new MutationObserver(decorate);watcher.observe(document.getElementById('device'),{childList:true,subtree:true});decorate();
})();

</script>
